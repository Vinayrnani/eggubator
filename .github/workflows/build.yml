name: Build ESP8266 Firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        pip3 install platformio
    
    - name: Build firmware
      run: |
        pio run
        mkdir -p firmware
        cp .pio/build/nodemcuv2/firmware.bin firmware/eggubator-firmware.bin || echo "Binary location may vary"
        find . -name "*.bin" -type f -exec cp {} firmware/eggubator-firmware.bin \;
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: esp8266-firmware
        path: firmware/