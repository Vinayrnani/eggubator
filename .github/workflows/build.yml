name: Build ESP8266 Firmware

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: pip3 install platformio
      
      - name: Compile firmware
        run: pio run
      
      - name: Find firmware
        run: |
          find . -name "*.bin" -type f
          ls -la .pio/build/nodemcuv2/firmware.bin 2>/dev/null || echo "Binary location may vary"
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: eggubator-firmware
          path: .pio/build/nodemcuv2/*.bin
          retention-days: 30